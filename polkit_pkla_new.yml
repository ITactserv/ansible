---
- name: Configure Polkit PKLA rule for NetworkManager (legacy method)
  hosts: all
  become: yes

  vars:
    polkit_file: /etc/polkit-1/localauthority/50-local.d/10-network-manager.pkla

  tasks:

    - name: Ensure polkit local authority directory exists
      file:
        path: /etc/polkit-1/localauthority/50-local.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy PKLA rule for all users
      copy:
        dest: "{{ polkit_file }}"
        content: |
          [Allow Users to Modify Connections]
          Identity=unix-user:*
          Action=org.freedesktop.NetworkManager.network-control
          ResultAny=yes
          ResultInactive=yes
          ResultActive=yes
        owner: root
        group: root
        mode: '0644'

    - name: Restart NetworkManager
      systemd:
        name: NetworkManager
        state: restarted

    - name: Confirm PKLA file deployed
      command: cat {{ polkit_file }}
      register: pkla_output

    - debug:
        var: pkla_output.stdout
