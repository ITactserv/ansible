---
- name: Configure Polkit NetworkManager rule (stable Semaphore version)
  hosts: all
  become: yes
  become_method: sudo

  vars:
    polkit_rule_file: /etc/polkit-1/rules.d/49-network-nopasswd.rules
    allowed_users:
      - actserv

  tasks:

    - name: Ensure polkit rules directory exists
      file:
        path: /etc/polkit-1/rules.d
        state: directory
        mode: '0755'

    - name: Install NetworkManager if missing (fix your failure)
      apt:
        name: network-manager
        state: present
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Ensure NetworkManager is running
      systemd:
        name: NetworkManager
        state: started
        enabled: yes

    - name: Deploy Polkit rule safely (no pre-checks)
      copy:
        dest: "{{ polkit_rule_file }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          polkit.addRule(function(action, subject) {
              if (
                  (action.id == "org.freedesktop.NetworkManager.network-control" ||
                   action.id == "org.freedesktop.NetworkManager.settings.modify.system") &&
                  {{ allowed_users | to_json }}.includes(subject.user)
              ) {
                  return polkit.Result.YES;
              }
          });

    - name: Restart polkit
      systemd:
        name: polkit
        state: restarted

    - name: Restart NetworkManager
      systemd:
        name: NetworkManager
        state: restarted
